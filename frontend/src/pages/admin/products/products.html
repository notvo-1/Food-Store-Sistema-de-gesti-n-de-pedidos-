<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Productos</title>
    <link rel="stylesheet" href="../../../style.css">
</head>
<body style="display: flex; margin: 0; min-height: 100vh; font-family: sans-serif; background-color: #f8f9fa;">

    <aside style="width: 240px; background-color: #333; color: white; padding: 20px; display: flex; flex-direction: column; gap: 15px;">
        <h3 style="color: #ff5722; margin-top: 0;">FoodStore Admin</h3>
        <hr style="border-color: #555; width: 100%;">
        <a href="../adminHome/adminHome.html" style="color: #ccc; text-decoration: none;">📊 Dashboard</a>
        <a href="../categories/categories.html" style="color: #ccc; text-decoration: none;">📁 Categorías</a>
        <a href="#" style="color: white; text-decoration: none; font-weight: bold;">🍔 Productos</a>
        <a href="../orders/orders.html" style="color: #ccc; text-decoration: none;">📦 Pedidos Admin</a>
    </aside>

    <main style="flex: 1; padding: 30px;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff5722; padding-bottom: 10px;">
            <h2 style="margin: 0;">Gestión de Productos</h2>
            <button id="btn-nuevo-prod" style="background-color: #2196f3; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                + Nuevo Producto
            </button>
        </div>

        <table style="width: 100%; border-collapse: collapse; margin-top: 20px; background-color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
            <thead>
                <tr style="background-color: #eee; text-align: left;">
                    <th style="padding: 12px; border: 1px solid #ddd;">ID</th>
                    <th style="padding: 12px; border: 1px solid #ddd;">Nombre</th>
                    <th style="padding: 12px; border: 1px solid #ddd;">Categoría</th>
                    <th style="padding: 12px; border: 1px solid #ddd;">Precio</th>
                    <th style="padding: 12px; border: 1px solid #ddd;">Stock</th>
                    <th style="padding: 12px; border: 1px solid #ddd; text-align: center;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-productos-body">
                </tbody>
        </table>

        <div id="modal-producto" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000;">
            <div style="background-color: white; padding: 25px; border-radius: 8px; width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;">
                <h3 style="margin-top: 0; color: #ff5722;">Nuevo Producto</h3>
                <form id="productoForm">
                    <div style="margin-bottom: 12px;">
                        <label for="prodNombre">Nombre (Obligatorio):</label>
                        <input type="text" id="prodNombre" style="width: 100%; padding: 8px; margin-top: 5px;" required>
                    </div>
                    <div style="margin-bottom: 12px;">
                        <label for="prodCategoria">Categoría (Obligatoria):</label>
                        <select id="prodCategoria" style="width: 100%; padding: 8px; margin-top: 5px;" required>
                            </select>
                    </div>
                    <div style="margin-bottom: 12px;">
                        <label for="prodPrecio">Precio (Mayor a 0):</label>
                        <input type="number" id="prodPrecio" step="0.01" style="width: 100%; padding: 8px; margin-top: 5px;" required>
                    </div>
                    <div style="margin-bottom: 12px;">
                        <label for="prodStock">Stock (Mayor o igual a 0):</label>
                        <input type="number" id="prodStock" style="width: 100%; padding: 8px; margin-top: 5px;" required>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label for="prodDescripcion">Descripción:</label>
                        <textarea id="prodDescripcion" style="width: 100%; padding: 8px; margin-top: 5px; height: 60px;"></textarea>
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 10px;">
                        <button type="button" id="btn-cerrar-modal" style="background-color: #888; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer;">Cancelar</button>
                        <button type="submit" style="background-color: #4caf50; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script type="module" src="./products.ts"></script>
</body>
</html>
