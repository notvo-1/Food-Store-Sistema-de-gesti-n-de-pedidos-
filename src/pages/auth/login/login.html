<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Food Store - Iniciar Sesión</title>
    <link rel="stylesheet" href="../../../style.css">
    </head>
<body>
    <header>
        <h1 id="titulo">Food Store</h1>
    </header>
    <nav id="barra-nav">
    <ul>
        <li><a href="../../store/home/home.html">Inicio</a></li>
        <li><a href="../../auth/login/login.html">Iniciar Sesión</a></li>
        <li><a href="../../auth/register/register.html">Registrarse</a></li>
        <li><a href="../../store/cart/cart.html">Carrito <span id="contador-carrito">0</span></a></li>
        <li><a href="../../admin/adminHome/adminHome.html" style="color: #ff6347; font-weight: bold;">🔧 Panel Admin</a></li>
    </ul>
</nav>
    <div style="max-width: 400px; margin: 100px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
        <h2>SuperFood - Iniciar Sesión</h2>
        <form id="loginForm">
            <div style="margin-bottom: 15px;">
                <label for="email">Email:</label><br>
                <input type="email" id="email" style="width: 100%; padding: 8px;" required>
            </div>
            <div style="margin-bottom: 15px;">
                <label for="password">Contraseña:</label><br>
                <input type="password" id="password" style="width: 100%; padding: 8px;" required>
            </div>
            <div id="errorMensaje" style="color: red; margin-bottom: 15px; display: none;"></div>
            <button type="submit" style="width: 100%; padding: 10px; background-color: #ff5722; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Ingresar
            </button>
        </form>
    </div>
    <script type="module" src="./login.ts"></script>
</body>
</html>
