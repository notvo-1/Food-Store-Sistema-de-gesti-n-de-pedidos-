<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/pizza-icon.png">
    <link rel="stylesheet" href="../../store/home/home.css"> <title>Detalle de Producto</title>
</head>
<body>
    <header>
        <h1 id="titulo">Food Store</h1>
    </header>

    <nav id="barra-nav">
        <ul>
            <li><a href="/src/pages/store/home/home.html">Inicio</a></li>
            <li><a href="../../auth/login/login.html">Iniciar Sesión</a></li>
            <li><a href="../../auth/register/register.html">Registrarse</a></li>
            <li><a href="../cart/cart.html">Carrito <span id="contador-carrito">0</span></a></li>
            <li><a href="../../admin/adminHome/adminHome.html" style="color: #ff6347; font-weight: bold;">🔧 Panel Admin</a></li>
            <li id="info-sesion" style="margin-left: auto; display: flex; align-items: center; gap: 10px; padding-right: 15px;"></li>
        </ul>
    </nav>
    <hr>

    <main style="max-width: 800px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);">
        <button id="btn-volver" style="background-color: #666; margin-bottom: 20px;">← Volver al Catálogo</button>
        
        <div style="display: flex; gap: 30px; flex-wrap: wrap;">
            <img id="prod-imagen" src="" alt="Producto" style="max-width: 350px; width: 100%; height: 250px; object-fit: cover; border-radius: 8px;">
            
            <div style="flex: 1; min-width: 250px;">
                <h2 id="prod-nombre" style="border: none; margin-bottom: 10px; color: #ff6347;">Cargando...</h2>
                <p id="prod-descripcion" style="color: #666; margin-bottom: 15px; font-size: 15px;"></p>
                <h3 id="prod-precio" style="color: #2e7d32; margin-bottom: 15px;">$0.00</h3>
                <p id="prod-stock" style="margin-bottom: 15px; font-weight: bold;"></p>
                
                <div id="seccion-compra" style="margin-top: 20px;">
                    <label for="input-cantidad" style="font-weight: bold;">Cantidad: </label>
                    <input type="number" id="input-cantidad" value="1" min="1" style="width: 60px; padding: 6px; margin-right: 10px; border-radius: 4px; border: 1px solid #ccc;">
                    <button id="btn-agregar-detalle" style="padding: 10px 20px;">Agregar al Carrito</button>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="./productDetail.ts"></script>
</body>
</html>
